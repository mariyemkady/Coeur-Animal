<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<title>Détail - Association de protection des animaux</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
  background: #f2f2f2;
}

.container {
  max-width: 700px;
  margin: 40px auto;
  background: white;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.1);
}

.container img {
  width: 100%;
  max-height: 300px;
  object-fit: cover;
  border-radius: 8px;
}

h1 {
  margin-top: 0;
  font-size: 1.5rem;
  color: #182170;
}

p {
  font-size: 1rem;
  line-height: 1.5;
  color: #333;
}

.btn {
  display: inline-block;
  margin-top: 20px;
  padding: 8px 16px;
  background: #026060;
  color: white;
  border: none;
  border-radius: 6px;
  text-decoration: none;
  cursor: pointer;
  font-size: 0.9rem;
}

</style>
</head>


<body>

<div class="container">

  <a href="index.html" class="btn">
    ← Retour
  </a>

  <h1 id="titre"></h1>

  <img id="img" src="" alt="Image">

  <p id="contenu"></p>

</div>


<script>

window.addEventListener('DOMContentLoaded', () => {

  const article = JSON.parse(
    localStorage.getItem('selectedArticle') || '{}'
  );


  if (!article.titre_fr) {

    document.querySelector('.container').innerHTML =
      '<p>Actualité introuvable.</p>';

    return;
  }


  document.getElementById('titre').textContent =
    article.titre_fr;


  document.getElementById('img').src =
    article.url_image;


  document.getElementById('contenu').textContent =
    article.contenu_fr || '';

});

</script>

</body>
</html>
