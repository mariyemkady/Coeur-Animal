<!DOCTYPE html>
<html lang="fr" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تسجيل الدخول - Static Advanced</title>
<style>
body{
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#f5f7fa,#c3cfe2);
  display:flex;justify-content:center;align-items:center;
  min-height:100vh;margin:0;direction:rtl;text-align:right;
  transition:0.3s all;
}
.container{max-width:400px;width:100%;padding:20px;}
h2{text-align:center;color:#1e3a8a;margin-bottom:30px;font-size:28px;}
form{
  background:#fff;padding:30px;border-radius:12px;
  box-shadow:0 8px 20px rgba(0,0,0,0.15);
  transition:0.3s all;
}
input{
  width:100%;padding:12px 15px;margin-bottom:20px;
  border-radius:8px;border:1px solid #ccc;font-size:16px;
  transition:0.3s all;
}
input:focus{
  outline:none;border-color:#1e3a8a;
  box-shadow:0 0 5px rgba(30,58,138,0.5);
}
button{
  width:100%;padding:12px;background:#1e3a8a;color:#fff;
  border:none;border-radius:8px;font-size:16px;
  cursor:pointer;transition:0.3s all;
}
button:hover{background:#3b5bb5;}
.message{text-align:center;font-weight:bold;margin-top:15px;}
.error{color:#e53935;}
.success{color:#43a047;}
.signup-link{text-align:center;margin-top:15px;}
.signup-link a{color:#f5df63;text-decoration:underline;font-weight:bold;}
#toggle-theme{
  position:absolute;top:10px;left:10px;
  padding:8px 12px;border:none;border-radius:6px;
  background:#1e3a8a;color:#fff;cursor:pointer;
}

/* Dark Mode */
body.dark{background:#121212;color:#e0e0e0;}
body.dark form{background:#1e1e1e;box-shadow:0 8px 20px rgba(0,0,0,0.5);}
body.dark input{background:#2c2c2c;color:#e0e0e0;border:1px solid #555;}
body.dark button{background:#90caf9;color:#121212;}
body.dark button:hover{background:#64b5f6;}
body.dark .signup-link a{color:#90caf9;}
body.dark #toggle-theme{background:#90caf9;color:#121212;}
</style>
</head>
<body>

<button id="toggle-theme">🌙</button>

<div class="container">
<h2> Connexion</h2>

<form id="login-form">
  <input type="email" id="email" placeholder="example@gmail.com" required>
  <input type="password" id="password" placeholder=" mot de passe" required>
  <button type="submit"> Connexion </button>
  <div id="message" class="message"></div>
</form>

<div class="signup-link">
Vous n'avez pas de compte ? <a href="signup.html">Créer un compte</a>
</div>
</div>

<script>
/* Dark Mode */
document.getElementById('toggle-theme')
.addEventListener('click',()=>document.body.classList.toggle('dark'));

/* Login Logic */
const form=document.getElementById('login-form');
const message=document.getElementById('message');

form.addEventListener('submit',e=>{
  e.preventDefault();
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;

  let users=JSON.parse(localStorage.getItem('users')||'[]');
  let user=users.find(u=>u.email===email && u.password===password);

  if(!user){
    message.textContent='Adresse e-mail ou mot de passe incorrect' ;
    message.className='message error';
    return;
  }

  localStorage.setItem('currentUser',JSON.stringify(user));
  message.textContent='Connexion réussie'; 
  message.className='message success';

  setTimeout(()=>window.location.href='profil.html',1000);
});
</script>

</body>
</html>
